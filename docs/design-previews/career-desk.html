function sync(){ $('#count').textContent=saved.size;for(const b of document.querySelectorAll('[data-add]')){const on=saved.has(b.dataset.add);b.textContent=on?'✓ Added':'+ Add';b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',(on?'Remove ':'Add ')+copy[b.dataset.add][0]+(on?' from kit':' to kit'));}if($('#kit-dialog').open)showList();}
function setStage(index){current=(index+3)%3;const s=stages[current],number=String(current+1).padStart(2,'0');document.body.dataset.activeStage=current;for(const b of document.querySelectorAll('[data-stage]'))b.setAttribute('aria-pressed',+b.dataset.stage===current);$('[data-art-title]').textContent=s.paper;$('[data-art-step]').textContent=number+' / 03';$('#plate-caption').textContent='Fig. '+number+' / '+s.caption;$('#step').textContent='Stage '+number+' / 03';$('#stage-title').textContent=s.title;const rows=$('#rows');rows.replaceChildren();for(const [i,name] of s.skills.entries()){const skill=catalog[name],row=node('article','row'),body=node('div'),details=node('details'),summary=node('summary','',copy[name][0]),detail=node('div','detail'),link=node('a','','View skill on GitHub ↗');link.href=skill.url;link.target='_blank';link.rel='noopener';detail.append(node('p','',skill.description),node('div','detail-meta',skill.repo+' · '+skill.license+' · Catalog review '+skill.reviewScore+'/10'),link);details.append(summary,detail);body.append(details,node('p','role',copy[name][1]));const add=node('button','add');add.dataset.add=name;add.onclick=()=>changeSaved(name);row.append(node('span','row-num',number+'.'+(i+1)),body,add);rows.append(row);}sync();rows.classList.remove('flip');void rows.offsetWidth;rows.classList.add('flip');}
for(const [i,s] of stages.entries()){const b=node('button','stage');b.dataset.stage=i;b.append(node('span','','0'+(i+1)),document.createTextNode(s.tab));b.onclick=()=>setStage(i);$('#workflow').append(b);}
$('#next').onclick=()=>setStage(current+1);$('#prev').onclick=()=>setStage(current-1);$('#art-turn').onclick=()=>setStage(current+1);
function showList(){const list=$('#saved');list.replaceChildren();$('#copy-status').textContent='';$('#kit-summary').textContent=saved.size?saved.size+' selected skill'+(saved.size===1?'':'s'):'Choose a stage and add the skills you want to take with you.';for(const name of saved){const li=node('li'),a=node('a','',copy[name][0]);a.href=catalog[name].url;a.target='_blank';a.rel='noopener';const b=node('button','','Remove');b.setAttribute('aria-label','Remove '+copy[name][0]);b.onclick=()=>{changeSaved(name);($('#saved button')||$('#close-kit')).focus();};li.append(a,b);list.append(li);}$('#copy-list').disabled=!saved.size;}
$('#open-kit').onclick=()=>{showList();$('#kit-dialog').showModal();};$('#close-kit').onclick=()=>$('#kit-dialog').close();$('#copy-list').onclick=async()=>{let links=[...saved].map(name=>copy[name][0]+' — '+catalog[name].url).join('\n');try{await navigator.clipboard.writeText(links);$('#copy-status').textContent='Copied to clipboard.';}catch{let t=node('textarea');t.setAttribute('aria-label','Selected skill links');t.style.width='100%';t.value=links;$('#copy-status').replaceChildren(document.createTextNode('Select and copy your links:'),t);t.focus();t.select();}};setStage(current);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const flipFile = () => {
 if(reduced.matches) return;
 const sheet=$('.folio-art__page');sheet.getAnimations().forEach(a=>a.cancel());
 sheet.animate([{transform:'perspective(800px) rotate(-3deg) rotateY(-17deg) translateY(-7%)',opacity:.65},{transform:'perspective(800px) rotate(-2deg) rotateY(4deg) translateY(-1%)',opacity:1,offset:.68},{transform:'rotate(-3deg)'}],{duration:510,easing:'cubic-bezier(.22,.67,.2,1)'});
};
new MutationObserver(flipFile).observe(document.body,{attributes:true,attributeFilter:['data-active-stage']});
</script><script>(()=>{const button=document.getElementById('night-shift'),root=document.documentElement;function sync(){button.setAttribute('aria-pressed',String(root.dataset.theme==='night'));}sync();button.onclick=()=>{root.dataset.theme=root.dataset.theme==='night'?'day':'night';sync();try{localStorage.setItem('skill-kits-theme',root.dataset.theme)}catch{}const url=new URL(location.href);if(url.searchParams.has('theme')){url.searchParams.set('theme',root.dataset.theme);try{history.replaceState(null,'',url)}catch{}}};document.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.getAttribute('href')?.split('?')[0]==='career-desk.html')a.href='career-desk.html?theme='+root.dataset.theme;},true);})();</script></body></html>
